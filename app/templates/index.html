<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WarehouseScanner - Сканирование</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; color: #212529; }
        .container { max-width: 1000px; margin: 0 auto; }

        .upload-card { background: #fff; padding: 15px 20px; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .upload-card form { display: flex; gap: 10px; align-items: center; }

        .header-stats { text-align: center; margin-bottom: 20px; }
        .shipment-title { font-size: 18px; color: #6c757d; margin-bottom: 10px; }
        .main-metrics { display: flex; justify-content: center; gap: 40px; }
        .metric-item { text-align: center; }
        .metric-val { font-size: 48px; font-weight: 800; color: #000; line-height: 1; }
        .metric-label { font-size: 13px; color: #8d959e; text-transform: uppercase; font-weight: bold; margin-top: 5px; }

        .scan-card { background: #fff; padding: 15px; border-radius: 8px; border: 2px solid #ffc107; margin-bottom: 15px; }
        #scan-input { width: 100%; padding: 12px; font-size: 28px; border: none; outline: none; box-sizing: border-box; }

        .status-box { padding: 15px; text-align: center; font-size: 28px; font-weight: bold; border-radius: 6px; color: #fff; margin-bottom: 20px; display: none; }
        .status-SEIZURE, .status-SEIZURE_PD { background-color: #dc3545; }
        .status-OK { background-color: #198754; }
        .status-REPEAT { background-color: #fd7e14; }
        .status-NOT_IN_DB, .status-INVALID { background-color: #6c757d; }

        .history-card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #dee2e6; }
        .history-title { font-size: 14px; font-weight: bold; color: #8d959e; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 0.5px; }

        .history-table { width: 100%; border-collapse: collapse; }
        .history-table tr { border-bottom: 1px solid #f1f3f5; }
        .history-table td { padding: 10px 5px; font-size: 16px; }

        .badge-NOT_IN_DB, .badge-INVALID { color: #dc3545; font-weight: bold; }
        .badge-REPEAT { color: #fd7e14; font-weight: bold; }
        .badge-SEIZURE, .badge-SEIZURE_PD { color: #dc3545; font-weight: bold; }
        .badge-OK { color: #198754; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. Загрузка Excel -->
    <div class="upload-card">
        <form id="upload-form">
            <b>Партия:</b>
            <input type="file" id="excel-file" accept=".xlsx, .xls" required>
            <button type="submit" style="padding: 6px 15px; background: #198754; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Загрузить</button>
        </form>
        <div>
            <b>ID Отгрузки:</b>
            <input type="number" id="shipment-id" value="1" style="width: 60px; font-size: 16px; text-align: center;">
            <button onclick="downloadReport()" style="padding: 6px 15px; background: #0d6efd; color: #fff; border: none; border-radius: 4px; cursor: pointer;">📊 Отчет</button>
        </div>
    </div>

    <!-- 2. Шапка статистики -->
    <div class="header-stats">
        <div class="shipment-title" id="file-name-display">Реестр не выбран</div>
        <div class="main-metrics">
            <div class="metric-item">
                <div class="metric-val"><span id="scanned-count">0</span> / <span id="total-count">0</span></div>
                <div class="metric-label">Найдено</div>
            </div>
            <div class="metric-item">
                <div class="metric-val" id="total-clicks">0</div>
                <div class="metric-label">Пикнули</div>
            </div>
        </div>
    </div>

    <!-- 3. Поле ввода сканера -->
    <div class="scan-card">
        <input type="text" id="scan-input" placeholder="Сканируйте штрихкод" autofocus autocomplete="off">
    </div>

    <!-- Плашка статуса -->
    <div id="status-box" class="status-box"></div>

    <!-- 4. История сканов -->
    <div class="history-card">
        <div class="history-title">Последние сканы</div>
        <table class="history-table">
            <tbody id="history-body"></tbody>
        </table>
    </div>

</div>

<script>
    const scanInput = document.getElementById('scan-input');
    const statusBox = document.getElementById('status-box');
    const historyBody = document.getElementById('history-body');

    let clickCounter = 0;
    const historyList = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const gainNode = audioCtx.createGain();
    gainNode.gain.value = 2.5;
    gainNode.connect(audioCtx.destination);

    document.addEventListener('click', () => {
        scanInput.focus();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    });

    function playSoundBoosted(soundFile) {
        if (!soundFile) return;
        fetch(`/static/sounds/${soundFile}`)
            .then(res => res.arrayBuffer())
            .then(buf => audioCtx.decodeAudioData(buf))
            .then(decoded => {
                const src = audioCtx.createBufferSource();
                src.buffer = decoded;
                src.connect(gainNode);
                src.start(0);
            }).catch(e => console.error(e));
    }

    // Загрузка файла
    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('excel-file');
        if (!fileInput.files[0]) return;

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const res = await fetch('/api/shipments/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (res.ok) {
                alert(`Файл загружен! ID отгрузки: ${data.shipment_id}`);
                document.getElementById('shipment-id').value = data.shipment_id;
                document.getElementById('file-name-display').innerText = data.filename;
            } else {
                alert(`Ошибка: ${data.detail}`);
            }
        } catch (err) { alert('Ошибка загрузки'); }
    });

    // Сканирование
    scanInput.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const code = scanInput.value.trim();
            const shipmentId = parseInt(document.getElementById('shipment-id').value);
            scanInput.value = '';

            if (!code) return;

            clickCounter++;
            document.getElementById('total-clicks').innerText = clickCounter;

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shipment_id: shipmentId, sticker_code: code, desk_id: "ПК-1" })
                });

                if (!response.ok) return;
                const data = await response.json();

                playSoundBoosted(data.sound_file);

                // ОБНОВЛЯЕМ ВЕРХНИЕ СЧЕТЧИКИ (ОБЩИЕ ПО ПАРТИИ)
                document.getElementById('scanned-count').innerText = data.shipment_scanned;
                document.getElementById('total-count').innerText = data.shipment_total;

                // ОБНОВЛЯЕМ ТАБЛИЦУ ИСТОРИИ
                historyList.unshift({
                    statusClass: `badge-${data.status}`,
                    statusText: data.sound_phrase,
                    code: code,
                    title: data.title || ''
                });
                if (historyList.length > 10) historyList.pop();

                renderHistory();

            } catch (err) { console.error(err); }
        }
    });

    function renderHistory() {
        historyBody.innerHTML = historyList.map(item => `
            <tr>
                <td style="width: 200px;" class="${item.statusClass}">${item.statusText}</td>
                <td style="width: 150px; font-family: monospace;"><b>${item.code}</b></td>
                <td>${item.title}</td>
            </tr>
        `).join('');
    }

    function downloadReport() {
        const id = document.getElementById('shipment-id').value;
        if (id) window.location.href = `/api/shipments/${id}/report`;
    }
</script>
</body>
</html>
